name: Android APK Build & Sign

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 (required by Android SDK build tools) ───────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Python 3.11 ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Pip cache ───────────────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Buildozer cache (Android SDK/NDK + p4a artifacts) ───────────────────
      - name: Cache .buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer/
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # ── System dependencies ──────────────────────────────────────────────────
      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # ── Python build tools ───────────────────────────────────────────────────
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install Cython==0.29.37
          pip install buildozer==1.5.0

      # ── Unit tests ───────────────────────────────────────────────────────────
      - name: Run unit tests
        run: python tests/test_sms_parser.py

      # ── Build release APK ────────────────────────────────────────────────────
      - name: Build Android release APK
        run: |
          yes | buildozer android release 2>&1 | tee build.log

      # ── Locate APK ───────────────────────────────────────────────────────────
      - name: Locate unsigned APK
        id: find_apk
        run: |
          APK_PATH=$(find bin/ .buildozer/ -name "*.apk" 2>/dev/null | grep -v signed | head -1)
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "Found APK: ${APK_PATH}"

      # ── Upload unsigned APK ──────────────────────────────────────────────────
      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-accountant-unsigned
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

      # ── Sign APK (only when signing secrets are configured) ─────────────────
      - name: Sign APK
        id: sign_apk
        if: ${{ secrets.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED_APK="${{ steps.find_apk.outputs.apk_path }}"

          # Decode base64 keystore to a temporary file
          KEYSTORE=$(mktemp --suffix=.jks)
          echo "$SIGNING_KEY" | base64 --decode > "$KEYSTORE"

          # Locate build tools from pre-installed SDK or buildozer-managed SDK
          APKSIGNER=$(find /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk \
            -name "apksigner" 2>/dev/null | sort -V | tail -1)
          ZIPALIGN=$(find /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk \
            -name "zipalign" 2>/dev/null | sort -V | tail -1)

          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "ERROR: apksigner or zipalign not found. Check Android SDK installation."
            rm -f "$KEYSTORE"
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          echo "Using zipalign:  $ZIPALIGN"

          # Align the APK before signing (required for apksigner)
          ALIGNED_APK="${UNSIGNED_APK%.apk}-aligned.apk"
          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Sign the aligned APK
          SIGNED_APK="bin/smart-accountant-release-signed.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # Verify signature
          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          # Securely remove keystore
          rm -f "$KEYSTORE"
          echo "Keystore deleted."

          echo "signed_apk=${SIGNED_APK}" >> $GITHUB_OUTPUT

      # ── Upload signed APK ────────────────────────────────────────────────────
      - name: Upload signed APK artifact
        if: steps.sign_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: smart-accountant-release-signed
          path: ${{ steps.sign_apk.outputs.signed_apk }}
          retention-days: 30

      # ── Upload build log on failure ──────────────────────────────────────────
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

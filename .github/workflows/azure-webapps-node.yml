# Python CI — runs unit tests for the SMS bank expense tracker
# (Replaces the auto-generated Node.js/Azure workflow which does not apply here)

name: Python CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        # Kivy/KivyMD are Android runtime deps; tests only need stdlib
        # Install nothing extra — tests use only built-in modules

    - name: Run SMS parser and categorizer tests
      run: python tests/test_sms_parser.py
